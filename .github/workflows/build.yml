name: Build ArmorPaint (Windows)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint

      - uses: microsoft/setup-msbuild@v2

      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Generate VS project
        working-directory: paint
        shell: cmd
        run: ..\base\make

      - name: Find the project file
        id: sln
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Include *.sln,*.slnx -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $proj) { $proj = Get-ChildItem -Recurse -Filter *.vcxproj -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $proj) { Write-Error "No project file found"; exit 1 }
          Write-Host "Using: $($proj.FullName)"
          "path=$($proj.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: msbuild "${{ steps.sln.outputs.path }}" /p:Configuration=Release /p:Platform=x64 /m

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\ArmorPaint | Out-Null
          Copy-Item paint\build\out\* dist\ArmorPaint\ -Recurse
          Copy-Item paint\build\x64\Release\ArmorPaint.exe dist\ArmorPaint\
          $sha  = git rev-parse --short HEAD
          $date = Get-Date -Format yyyy-MM-dd
          $zip  = "ArmorPaint-Windows-$date.zip"
          Compress-Archive -Path dist\ArmorPaint -DestinationPath $zip
          Get-ChildItem dist\ArmorPaint | ForEach-Object { $_.Name }
          "tag=build-$date-$sha" >> $env:GITHUB_OUTPUT
          "zip=$zip"            >> $env:GITHUB_OUTPUT
          "sha=$sha"            >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows
          path: dist/ArmorPaint
          retention-days: 7

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: ArmorPaint ${{ steps.pkg.outputs.tag }}
          body: |
            Automatic Windows build of [armory3d/armorpaint](https://github.com/armory3d/armorpaint) at commit `${{ steps.pkg.outputs.sha }}`.
            Unzip, open the ArmorPaint folder, run ArmorPaint.exe.
          files: ${{ steps.pkg.outputs.zip }}
          make_latest: true
