name: Build ArmorPaint (Windows)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint

      - uses: microsoft/setup-msbuild@v2

      - name: Generate VS project
        working-directory: paint
        shell: cmd
        run: ..\base\make

      - name: Find the .sln
        id: sln
        working-directory: paint
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Depth 3 -Filter *.sln | ForEach-Object { $_.FullName }
          $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          if (-not $sln) { Write-Error "No .sln generated - check the Generate step"; exit 1 }
          "path=$($sln.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: msbuild "${{ steps.sln.outputs.path }}" /p:Configuration=Release /p:Platform=x64 /m

      - name: Show where the exe landed
        working-directory: paint
        shell: pwsh
        run: Get-ChildItem -Recurse -Filter *.exe | ForEach-Object { $_.FullName }

      - uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows
          path: |
            paint/build
            !paint/build/**/*.obj
            !paint/build/**/*.pdb
            !paint/build/**/*.ilk
            !paint/build/**/*.tlog
            !paint/build/**/*.iobj
            !paint/build/**/*.ipdb
          retention-days: 7
