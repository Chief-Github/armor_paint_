name: Build ArmorPaint (Windows)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint

      - uses: microsoft/setup-msbuild@v2

      - name: Generate VS project
        working-directory: paint
        shell: cmd
        run: ..\base\make

      - name: Find the project file
        id: sln
        shell: pwsh
        run: |
          Write-Host "=== Every .sln / .vcxproj in the repo ==="
          Get-ChildItem -Recurse -Include *.sln,*.slnx,*.vcxproj -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }

          Write-Host "=== What's in the build folders ==="
          foreach ($d in "paint\build","base\build","build") {
            if (Test-Path $d) { Write-Host "--- $d ---"; Get-ChildItem $d | ForEach-Object { $_.Name } }
          }

          $proj = Get-ChildItem -Recurse -Include *.sln,*.slnx -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $proj) { $proj = Get-ChildItem -Recurse -Filter *.vcxproj -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $proj) { Write-Error "No project file anywhere - send Claude this log"; exit 1 }
          Write-Host "Using: $($proj.FullName)"
          "path=$($proj.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: msbuild "${{ steps.sln.outputs.path }}" /p:Configuration=Release /p:Platform=x64 /m

      - name: Show where the exe landed
        working-directory: paint
        shell: pwsh
        run: Get-ChildItem -Recurse -Filter *.exe | ForEach-Object { $_.FullName }

      - uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows
          path: |
            paint/build
            !paint/build/**/*.obj
            !paint/build/**/*.pdb
            !paint/build/**/*.ilk
            !paint/build/**/*.tlog
            !paint/build/**/*.iobj
            !paint/build/**/*.ipdb
          retention-days: 7
